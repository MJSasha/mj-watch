    <radialGradient id="halo"><stop stop-color="#00CEE2" stop-opacity=".25"/><stop offset="1" stop-color="#00CEE2" stop-opacity="0"/></radialGradient>
    <linearGradient id="front" x2="80%" y2="100%"><stop stop-color="#50F099"/><stop offset="1" stop-color="#00CEE2"/></linearGradient>
    <linearGradient id="warm" x2="85%" y2="95%"><stop stop-color="#00CEE2"/><stop offset="1" stop-color="#00CEE2" stop-opacity=".56"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>
  <style>
