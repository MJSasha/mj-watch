name: Two phones and two TVs
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: phone-tv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set shared Android tool directories
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/issue26-android" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/issue26-android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/issue26-android/avd" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64 system-images;android-36;android-tv;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Build actual phone and TV APKs and tests
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :app-mobile:assembleDebug :app-tv:assembleDebug :app-mobile:assembleDebugAndroidTest :app-tv:assembleDebugAndroidTest --no-daemon
      - name: Prepare KVM and long test video
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p dist/phone-tv
          ffmpeg -hide_banner -loglevel error -stream_loop 29 -i playback/src/main/assets/demo.mp4 -c copy dist/phone-tv-long.mp4
      - name: Boot two phones and two independent TVs
        run: |
          set -e
          test -x "$ANDROID_HOME/emulator/emulator"
          mkdir -p "$ANDROID_AVD_HOME"
          adb start-server
          echo no | avdmanager create avd --force -n issue26-phone -p "$ANDROID_AVD_HOME/issue26-phone.avd" -k 'system-images;android-36;google_apis;x86_64' -d pixel_2
          echo no | avdmanager create avd --force -n issue26-phone2 -p "$ANDROID_AVD_HOME/issue26-phone2.avd" -k 'system-images;android-36;google_apis;x86_64' -d pixel_2
          echo no | avdmanager create avd --force -n issue26-tv1 -p "$ANDROID_AVD_HOME/issue26-tv1.avd" -k 'system-images;android-36;android-tv;x86_64' -d tv_720p
          echo no | avdmanager create avd --force -n issue26-tv2 -p "$ANDROID_AVD_HOME/issue26-tv2.avd" -k 'system-images;android-36;android-tv;x86_64' -d tv_720p
          for name in issue26-phone issue26-phone2 issue26-tv1 issue26-tv2; do
            test -f "$ANDROID_AVD_HOME/$name.ini"
          done
          "$ANDROID_HOME/emulator/emulator" -list-avds
          # Keep four guests within the runner's CPU/GPU budget; the primary
          # phone retains the design-reference viewport in the test runner.
          python3 - <<'PYCODE'
          import os,pathlib
          for config in pathlib.Path(os.environ['ANDROID_AVD_HOME']).glob('*.avd/config.ini'):
              lines=[line for line in config.read_text().splitlines() if not line.startswith('hw.lcd.vsync=')]
              config.write_text('\n'.join(lines+['hw.lcd.vsync=30'])+'\n')
          PYCODE
          nproc
          free -m
          # Disposable CI AVDs need no interactive host-debugging trust dialog.
          "$ANDROID_HOME/emulator/emulator" -skip-adb-auth -avd issue26-phone -port 5570 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 1 > dist/phone-tv/phone-boot.log 2>&1 &
          "$ANDROID_HOME/emulator/emulator" -skip-adb-auth -avd issue26-phone2 -skin 720x1280 -dpi-device 280 -port 5576 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 1 > dist/phone-tv/phone2-boot.log 2>&1 &
          "$ANDROID_HOME/emulator/emulator" -skip-adb-auth -avd issue26-tv1 -port 5572 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 1 > dist/phone-tv/tv1-boot.log 2>&1 &
          "$ANDROID_HOME/emulator/emulator" -skip-adb-auth -avd issue26-tv2 -port 5574 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 1 > dist/phone-tv/tv2-boot.log 2>&1 &
          python3 - <<'PY'
          import subprocess,time
          deadline=time.monotonic()+300
          waiting={'emulator-5570','emulator-5572','emulator-5574','emulator-5576'}
          while waiting and time.monotonic()<deadline:
              for serial in list(waiting):
                  result=subprocess.run(['adb','-s',serial,'shell','getprop','sys.boot_completed'],capture_output=True,text=True)
                  if result.stdout.strip()=='1':waiting.remove(serial)
              time.sleep(2)
          if waiting:
              subprocess.run(['adb','devices','-l'])
              raise SystemExit('Boot timeout: '+str(waiting))
          # Boot-completed precedes first-launch system-service initialization.
          time.sleep(30)
          PY
      - name: Check real UI, receiver frames, system commands and recovery
        run: python3 scripts/check-phone-tv.py --video dist/phone-tv-long.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-tv-evidence
          path: |
            dist/phone-tv/**/*.log
            dist/phone-tv/**/*.png
            dist/phone-tv/**/*.txt
