name: Two phones and two TVs
on:
  workflow_dispatch:
  push:
    branches: [codex/issue-26-phone-tv]
permissions:
  contents: read
concurrency:
  group: phone-tv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64 system-images;android-36;android-tv;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Build actual phone and TV APKs and tests
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :app-mobile:assembleDebug :app-tv:assembleDebug :app-mobile:assembleDebugAndroidTest :app-tv:assembleDebugAndroidTest --no-daemon
      - name: Prepare KVM and long test video
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p dist/phone-tv
          ffmpeg -hide_banner -loglevel error -stream_loop 29 -i playback/src/main/assets/demo.mp4 -c copy dist/phone-tv-long.mp4
      - name: Boot phone and two independent TVs
        run: |
          set -e
          echo no | avdmanager create avd --force -n issue26-phone -k 'system-images;android-36;google_apis;x86_64' -d pixel_2
          echo no | avdmanager create avd --force -n issue26-phone2 -k 'system-images;android-36;google_apis;x86_64' -d pixel_2
          echo no | avdmanager create avd --force -n issue26-tv1 -k 'system-images;android-36;android-tv;x86_64' -d tv_1080p
          echo no | avdmanager create avd --force -n issue26-tv2 -k 'system-images;android-36;android-tv;x86_64' -d tv_1080p
          emulator -avd issue26-phone -port 5570 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 1024 -cores 2 > dist/phone-tv/phone-boot.log 2>&1 &
          emulator -avd issue26-phone2 -port 5576 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 1024 -cores 2 > dist/phone-tv/phone2-boot.log 2>&1 &
          emulator -avd issue26-tv1 -port 5572 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 1024 -cores 2 > dist/phone-tv/tv1-boot.log 2>&1 &
          emulator -avd issue26-tv2 -port 5574 -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -memory 1024 -cores 2 > dist/phone-tv/tv2-boot.log 2>&1 &
          python3 - <<'PY'
          import subprocess,time
          deadline=time.monotonic()+300
          waiting={'emulator-5570','emulator-5572','emulator-5574','emulator-5576'}
          while waiting and time.monotonic()<deadline:
              for serial in list(waiting):
                  result=subprocess.run(['adb','-s',serial,'shell','getprop','sys.boot_completed'],capture_output=True,text=True)
                  if result.stdout.strip()=='1':waiting.remove(serial)
              time.sleep(2)
          if waiting:raise SystemExit('Boot timeout: '+str(waiting))
          PY
      - name: Check real UI, receiver frames, system commands and recovery
        run: python3 scripts/check-phone-tv.py --video dist/phone-tv-long.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-tv-evidence
          path: |
            dist/phone-tv/**/*.log
            dist/phone-tv/**/*.png
            dist/phone-tv/**/*.txt
