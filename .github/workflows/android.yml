name: Android
on:
  push:
    paths-ignore: ["docs/**", "design/**", "STATUS.md", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "design/**", "STATUS.md", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:testDebugUnitTest :app-mobile:lintDebug :app-tv:lintDebug :app-mobile:assembleDebug :app-tv:assembleDebug :app-mobile:assembleRelease :app-tv:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjwatch-apks-and-reports
          path: |
            app-*/build/outputs/apk/**/*.apk
            **/build/reports/
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app-mobile
            api: 35
            target: default
            profile: pixel_2
          - app: app-tv
            api: 36
            target: android-tv
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - id: runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: ./gradlew :${{ matrix.app }}:connectedDebugAndroidTest
      - id: boot-check
        if: steps.runtime.outcome == 'failure'
        run: |
          if [ -d "${{ matrix.app }}/build/outputs/androidTest-results/connected" ]; then
            echo 'retry=false' >> "$GITHUB_OUTPUT"
          else
            echo 'retry=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retry emulator boot before tests
        if: steps.boot-check.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: ./gradlew :${{ matrix.app }}:connectedDebugAndroidTest
      - name: Preserve test failures
        if: steps.runtime.outcome == 'failure' && steps.boot-check.outputs.retry != 'true'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.app }}
          path: app-*/build/reports/androidTests/
  publish-testing:
    needs: [build, runtime]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Sign and publish immutable testing release
        env:
          GH_TOKEN: ${{ github.token }}
          MJWATCH_TEST_KEYSTORE_B64: ${{ secrets.MJWATCH_TEST_KEYSTORE_B64 }}
        run: scripts/publish_testing.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mjwatch-published-apks
          path: dist/
