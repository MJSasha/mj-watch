name: Android
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "STATUS.md", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "design/**", "STATUS.md", "README.md"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify prepared assets without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: server/go.sum
      - run: sh server/check.sh
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: server/go.sum
      - run: sh server/prepare-ci.sh --local-test
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and build debug APKs
        run: ./gradlew "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" :core:testDebugUnitTest :playback:testDebugUnitTest :app-mobile:lintDebug :app-tv:lintDebug :app-mobile:assembleDebug :app-tv:assembleDebug --build-cache --no-daemon --stacktrace
      - name: Check release APK compilation on PRs
        if: github.event_name == 'pull_request'
        run: ./gradlew "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" :app-mobile:assembleRelease :app-tv:assembleRelease --build-cache --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjwatch-apks-and-reports
          path: |
            app-*/build/outputs/apk/**/*.apk
            **/build/reports/
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app-mobile
            api: 35
            target: default
            profile: pixel_2
          - app: app-tv
            api: 36
            target: android-tv
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: server/go.sum
      - run: sh server/prepare-ci.sh --local-test
      - uses: gradle/actions/setup-gradle@v4
      - run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: |
            set -e
            echo "Emulator ready at $(date -u +%FT%TZ)"
            ./gradlew --profile --build-cache :${{ matrix.app }}:connectedDebugAndroidTest
            if [ "${{ matrix.app }}" = "app-tv" ]; then ./gradlew --profile --build-cache :playback:connectedDebugAndroidTest; fi
            if [ "${{ matrix.app }}" = "app-mobile" ]; then ./gradlew --profile --build-cache :core:connectedDebugAndroidTest && bash scripts/check-offline-emulator.sh; fi
            echo "Runtime checks passed at $(date -u +%FT%TZ)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.app }}
          path: |
            app-*/build/reports/androidTests/
            playback/build/reports/androidTests/
            core/build/reports/androidTests/
            build/reports/profile/
  prepare-release:
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: server/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare stable server supply
        if: github.ref == 'refs/heads/main'
        run: sh server/prepare-ci.sh
        env:
          MJWATCH_RELEASE_SIGNING_KEY: ${{ secrets.MJWATCH_RELEASE_SIGNING_KEY }}
      - name: Sign stable APKs
        if: github.ref == 'refs/heads/main'
        run: scripts/prepare_release.sh
        env:
          MJWATCH_TEST_KEYSTORE_B64: ${{ secrets.MJWATCH_TEST_KEYSTORE_B64 }}
      - name: Prepare dry-run assets with disposable keys
        if: github.ref != 'refs/heads/main'
        run: |
          sh server/prepare-ci.sh --local-test
          scripts/prepare_release.sh --local-test
      - uses: actions/upload-artifact@v4
        with:
          name: mjwatch-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
  publish-release:
    needs: [server, build, runtime, prepare-release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mjwatch-release-${{ github.sha }}
          path: dist/release
      - name: Verify and publish prepared assets
        env:
          GH_TOKEN: ${{ github.token }}
          MJWATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: scripts/publish_release.sh
  verify-dry-run:
    needs: [server, build, runtime, prepare-release]
    if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mjwatch-release-${{ github.sha }}
          path: dist/release
      - run: scripts/publish_release.sh
        env:
          MJWATCH_DRY_RUN: 'true'
